# §5b (host networking) — a bridge do NAS não dá egress pra internet, então agente E caddy usam a
# rede do host (que alcança a Vercel p/ o finalize). Caddy termina TLS na :443 e fala com o agente
# por localhost:8080 (agente em loopback — não exposto na LAN em http). Sem túnel (upload LAN-only).
services:
  agent:
    build: ./agent
    image: nas-poc-agent:latest
    restart: unless-stopped
    network_mode: host
    user: "${AGENT_UID}:${AGENT_GID}"
    environment:
      NAS_ROOT: /data
      STATE_DIR: /data/.agent-state
      LAN_PORT: "8080"
      LAN_HOST: "127.0.0.1" # loopback: só o Caddy (mesma rede host) alcança; LAN não vê o http cru
      TUNNEL_PORT: "8081"
      TUNNEL_HOST: "127.0.0.1"
      POC_HASH_MODE: "${POC_HASH_MODE:-inline}"
      MAX_UPLOAD_BYTES: "${MAX_UPLOAD_BYTES:-5368709120}"
      ALLOWED_ORIGIN: "${ALLOWED_ORIGIN}"
      CLOUD_FINALIZE_URL: "${CLOUD_FINALIZE_URL}"
      FINALIZE_SECRET: "${FINALIZE_SECRET}"
      RECONCILE_TOKEN: "${RECONCILE_TOKEN}"
      TOKEN_PUBLIC_KEYS: "${TOKEN_PUBLIC_KEYS}"
      AGENT_VERSION: "0.2.0"
    volumes:
      - "${NAS_SHARE_PATH:-/volume1/WorkOS-PoC}:/data"

  caddy:
    # Build local com o módulo DNS da Cloudflare (ver Dockerfile.caddy) — a imagem oficial
    # `caddy:2` não traz provedores de DNS, e sem provedor não há ACME DNS-01.
    build:
      context: .
      dockerfile: Dockerfile.caddy
    image: caddy-cloudflare:2
    restart: unless-stopped
    network_mode: host
    depends_on:
      - agent
    environment:
      # Token da Cloudflare com escopo Zone:DNS:Edit na zona goonmarketing.com. Vive no .env do
      # NAS, nunca no repositório. É o que permite ao Caddy escrever o TXT de desafio.
      CF_API_TOKEN: "${CF_API_TOKEN}"
    volumes:
      - "./Caddyfile:/etc/caddy/Caddyfile:ro"
      # `./certs` saiu: não há mais cert copiado à mão. O certificado emitido e a conta ACME
      # vivem em `caddy_data` — este volume PRECISA persistir, senão cada recriação do container
      # pede um certificado novo e bate no limite de emissões da Let's Encrypt.
      - "caddy_data:/data"
      - "caddy_config:/config"

volumes:
  caddy_data:
  caddy_config:
